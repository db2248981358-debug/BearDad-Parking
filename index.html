
<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#287a4e">
<meta name="description" content="熊爸找車位：新北市路邊空位與公共停車場">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<title>熊爸找車位 V2.5</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#faf8e9;color:#24382b;font-family:system-ui,"Microsoft JhengHei",sans-serif}
header{background:#287a4e;color:white;text-align:center;padding:15px;font-size:22px;font-weight:800}
main{max-width:900px;margin:auto;padding:12px}
.panel{background:white;border:1px solid #e1e7db;border-radius:16px;padding:13px;margin-bottom:12px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
button,select{font:inherit;border-radius:10px;padding:10px;border:1px solid #ccd9cb}
button{background:#287a4e;color:white;font-weight:700}
button:disabled{opacity:.5}
select{background:white}
#map{width:100%;height:55vh;min-height:340px;border-radius:12px;z-index:0}
#status,#parkStatus{font-size:14px;line-height:1.7;white-space:pre-wrap}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;margin:10px 0}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:4px;vertical-align:middle}
.green{background:#17a34a}
.red{background:#e43e3e}
.gray{background:#87939a}
.blue{background:#2775d6}
.item{border-top:1px solid #e6eae4;padding:11px 0;font-size:14px}
.item:first-child{border-top:0}
.muted{color:#68776b;font-size:13px;line-height:1.7}
.nav{display:inline-block;background:#e4f2e6;color:#17683c;padding:8px 12px;border-radius:9px;text-decoration:none;font-weight:700;margin-top:6px}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.stat{flex:1;min-width:85px;background:#f5f8f1;border-radius:12px;text-align:center;padding:10px}
.stat b{display:block;font-size:23px}
.stat small{font-size:12px;color:#68776b}
.leaflet-popup-content{line-height:1.6}
.leaflet-popup-content a{color:#17683c;font-weight:bold}
.park{border-left:4px solid #2775d6;padding-left:12px}
.parkTitle{font-weight:800;font-size:16px}
.avail{font-weight:800;color:#178746;font-size:19px}
.parkPin{background:#2775d6;color:white;border:2px solid white;border-radius:8px;font-weight:800;text-align:center;line-height:24px;box-shadow:0 1px 5px #777}
</style>
</head>
<body>
<header>🚗 熊爸找車位 V2.5</header>
<main>

<section class="panel">
 <div class="row">
  <label for="radius">搜尋範圍</label>
  <select id="radius">
   <option value="200">200 公尺</option>
   <option value="500" selected>500 公尺</option>
   <option value="1000">1 公里</option>
  </select>
  <button id="search">📍 定位搜尋</button>
  <button id="refresh">↻ 更新</button>
  <button id="cancel" disabled>停止</button>
 </div>
 <p id="status">準備 GPS 定位…</p>
</section>

<section class="panel">
 <div class="stats">
  <div class="stat"><b id="freeCount">0</b><small>空位</small></div>
  <div class="stat"><b id="busyCount">0</b><small>佔用</small></div>
  <div class="stat"><b id="unknownCount">0</b><small>其他／未知</small></div>
 </div>
 <div class="legend">
  <span><i class="dot green"></i>空位</span>
  <span><i class="dot red"></i>佔用</span>
  <span><i class="dot gray"></i>未知</span>
  <span><i class="dot blue"></i>公有停車場 P／我的位置</span>
 </div>
 <div id="map"></div>
 <p class="muted">
  地圖預設視野約為周圍 80 公尺，可自由縮放。
  路邊車格最多顯示最近 100 格。
  停車狀態與實際剩餘數量可能隨時變動。
 </p>
</section>

<section class="panel">
 <strong>🟢 附近路邊空位</strong>
 <p id="total" class="muted">尚未取得資料</p>
 <div id="list"></div>
</section>

<section class="panel">
 <strong>🅿️ 附近公有停車場</strong>
 <p id="parkStatus" class="muted">尚未查詢</p>
 <div id="parkList"></div>
</section>

<section class="panel muted">
 <p><a href="https://tcdgis.ntpc.gov.tw/public/" target="_blank" rel="noopener">新北市官方路邊停車地圖</a></p>
 <p><a href="https://www.parkinginfo.ntpc.gov.tw/parkingrealInfo/" target="_blank" rel="noopener">新北市官方公有停車場查詢</a></p>
 資料來源：新北市政府開放資料。
 地圖使用 OpenStreetMap。距離為直線距離。
 公有停車場剩餘數量以政府資料為準，未提供即時數據者不顯示為空位。
</section>

</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
"use strict";

const BASE="https://beardad-parking-api.db2248981358.workers.dev";
const ROAD_API=BASE+"/parking";
const PARK_API=BASE+"/carparks";

const DEFAULT_MAP_VIEW_RADIUS=80;
const MAX_RESULTS=100;
const MAX_SEARCH_RADIUS=1000;
const $=id=>document.getElementById(id);

let map,roadLayer,parkLayer,meMarker,rangeCircle;
let here=null,running=false,stop=false;
let all=new Map(),parks=[];
let completed=false,scanned=0,pages=0;
let activeController=null;

function esc(s){
 return String(s??"").replace(/[&<>"']/g,c=>({
  "&":"&amp;","<":"&lt;",">":"&gt;",
  '"':"&quot;","'":"&#39;"
 }[c]));
}

function classification(r){
 const p=String(r.parkingstatus??"").trim();
 const c=String(r.cellstatus??"").trim().toUpperCase();
 if(p==="1"&&c==="Y")return "busy";
 if(p==="2"&&c==="N")return "free";
 return "unknown";
}

function color(s){
 return s==="free"?"#17a34a":
        s==="busy"?"#e43e3e":"#87939a";
}

function stateName(s){
 return s==="free"?"空位":
        s==="busy"?"佔用":"未知／其他";
}

function navURL(lat,lon){
 return "https://www.google.com/maps/dir/?api=1"+
  "&destination="+encodeURIComponent(lat+","+lon)+
  "&travelmode=driving";
}

function initMap(){
 if(typeof L==="undefined"){
  $("status").textContent="地圖元件載入失敗，請檢查網路。";
  return;
 }
 map=L.map("map").setView([25.01,121.51],13);
 L.tileLayer(
  "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
  {maxZoom:19,attribution:"© OpenStreetMap contributors"}
 ).addTo(map);
 roadLayer=L.layerGroup().addTo(map);
 parkLayer=L.layerGroup().addTo(map);
}

function updateLocation(){
 if(!map||!here)return;
 const radius=Math.min(Number($("radius").value),MAX_SEARCH_RADIUS);
 const pos=[here.lat,here.lon];

 if(meMarker)map.removeLayer(meMarker);
 if(rangeCircle)map.removeLayer(rangeCircle);

 meMarker=L.circleMarker(pos,{
  radius:9,color:"#fff",weight:3,
  fillColor:"#2775d6",fillOpacity:1
 }).addTo(map).bindPopup("我的 GPS 位置");

 rangeCircle=L.circle(pos,{
  radius,color:"#287a4e",weight:1,fillOpacity:.04
 }).addTo(map);

 const earthRadius=6378137;
 const latRad=here.lat*Math.PI/180;
 const latOffset=DEFAULT_MAP_VIEW_RADIUS/earthRadius*180/Math.PI;
 const lonOffset=DEFAULT_MAP_VIEW_RADIUS/
  (earthRadius*Math.cos(latRad))*180/Math.PI;

 const bounds=L.latLngBounds(
  [here.lat-latOffset,here.lon-lonOffset],
  [here.lat+latOffset,here.lon+lonOffset]
 );
 map.fitBounds(bounds,{
  padding:[12,12],maxZoom:19,animate:false
 });
}

function getGPS(){
 return new Promise((resolve,reject)=>{
  if(!navigator.geolocation){
   reject(Error("瀏覽器不支援 GPS"));return;
  }
  navigator.geolocation.getCurrentPosition(
   p=>resolve({
    lat:p.coords.latitude,
    lon:p.coords.longitude,
    accuracy:p.coords.accuracy
   }),
   e=>reject(Error("GPS 定位失敗："+e.message)),
   {enableHighAccuracy:true,timeout:16000,maximumAge:10000}
  );
 });
}

function closestRows(){
 return [...all.values()]
  .filter(r=>
   Number.isFinite(Number(r.distance)) &&
   Number.isFinite(Number(r.latitude)) &&
   Number.isFinite(Number(r.longitude))
  )
  .sort((a,b)=>Number(a.distance)-Number(b.distance))
  .slice(0,MAX_RESULTS);
}

function renderRoad(){
 if(!map)return;
 roadLayer.clearLayers();

 const closest=closestRows();
 const counts={free:0,busy:0,unknown:0};
 closest.forEach(r=>counts[classification(r)]++);

 $("freeCount").textContent=counts.free;
 $("busyCount").textContent=counts.busy;
 $("unknownCount").textContent=counts.unknown;

 for(const r of closest){
  const s=classification(r);
  const popup=`
   <strong>${esc(r.roadname||"未提供道路")}</strong>
   <div>車格編號：${esc(r.cellid)}</div>
   <div>狀態：${stateName(s)}</div>
   <div>距離：${Math.round(Number(r.distance))} 公尺</div>
   <div>收費：${esc(r.paycash||"未提供")}</div>
   <a href="${navURL(r.latitude,r.longitude)}"
      target="_blank" rel="noopener">🧭 導航</a>
  `;

  L.circleMarker(
   [Number(r.latitude),Number(r.longitude)],
   {
    radius:7,color:"#fff",weight:1.5,
    fillColor:color(s),fillOpacity:.95
   }
  ).bindPopup(popup).addTo(roadLayer);
 }

 const free=closest.filter(r=>classification(r)==="free");

 $("total").textContent=
  `最近 ${closest.length} 格中，有 ${free.length} 格空位`+
  (completed?"（掃描完成）":"（掃描中）");

 $("list").innerHTML=free.map(r=>`
  <div class="item">
   <span class="dot green"></span>
   <b>${esc(r.roadname||"未提供道路")}</b>
   ｜格號 ${esc(r.cellid)}
   <div class="muted">
    空位｜${Math.round(Number(r.distance))} 公尺｜
    ${esc(r.paycash||"未提供收費")}
   </div>
   <a class="nav" href="${navURL(r.latitude,r.longitude)}"
      target="_blank" rel="noopener">🧭 導航</a>
  </div>
 `).join("")||
 "<p class='muted'>目前沒有符合條件的空位車格。</p>";
}

function renderParks(){
 if(!map)return;
 parkLayer.clearLayers();

 const rows=parks.filter(r=>
  Number.isFinite(Number(r.latitude)) &&
  Number.isFinite(Number(r.longitude))
 );

 for(const p of rows){
  const available=p.availableCar;
  const hasLive=p.hasRealtime&&
   available!==null&&Number.isFinite(Number(available));

  const value=hasLive
   ? Number(available)+" 格"
   : "無即時資料";

  const icon=L.divIcon({
   className:"",
   html:"<div class='parkPin' style='width:30px;height:28px'>P</div>",
   iconSize:[30,28],
   iconAnchor:[15,14]
  });

  L.marker(
   [Number(p.latitude),Number(p.longitude)],
   {icon}
  ).bindPopup(`
   <strong>${esc(p.name)}</strong>
   <div>剩餘汽車車位：${esc(value)}</div>
   <div>地址：${esc(p.address)}</div>
   <div>距離：${esc(p.distance)} 公尺</div>
   <div>收費：${esc(p.payex||"未提供")}</div>
   <div>開放時間：${esc(p.serviceTime||"未提供")}</div>
   <a href="${navURL(p.latitude,p.longitude)}"
      target="_blank" rel="noopener">🧭 導航</a>
  `).addTo(parkLayer);
 }

 $("parkList").innerHTML=rows.map(p=>{
  const hasLive=p.hasRealtime&&
   p.availableCar!==null&&
   Number.isFinite(Number(p.availableCar));

  const available=hasLive
   ? Number(p.availableCar)+" 格"
   : "無即時資料";

  return `
   <div class="item park">
    <div class="parkTitle">🅿️ ${esc(p.name||"未命名停車場")}</div>
    <div>剩餘車位：
     <span class="avail">${esc(available)}</span>
    </div>
    <div class="muted">
     距離 ${esc(p.distance)} 公尺｜
     總車位 ${Number.isFinite(Number(p.totalCar))?
      esc(p.totalCar):"未提供"}
    </div>
    <div class="muted">地址：${esc(p.address||"未提供")}</div>
    <div class="muted">收費：${esc(p.payex||"未提供")}</div>
    <div class="muted">開放時間：${esc(p.serviceTime||"未提供")}</div>
    <a class="nav" href="${navURL(p.latitude,p.longitude)}"
       target="_blank" rel="noopener">🧭 導航</a>
   </div>
  `;
 }).join("")||
 "<p class='muted'>搜尋範圍內沒有取得公有停車場資料。</p>";
}

async function loadCarparks(lat,lon,radius){
 $("parkStatus").textContent="正在讀取公有停車場…";
 parks=[];
 renderParks();

 try{
  const u=new URL(PARK_API);
  u.searchParams.set("lat",String(lat));
  u.searchParams.set("lon",String(lon));
  u.searchParams.set("radius",String(radius));

  const response=await fetch(u,{cache:"no-store"});
  if(!response.ok){
   throw Error("HTTP "+response.status);
  }

  const obj=await response.json();
  if(!Array.isArray(obj.data)){
   throw Error("停車場資料格式不正確");
  }

  parks=obj.data.sort(
   (a,b)=>Number(a.distance)-Number(b.distance)
  );
  renderParks();

  const liveCount=parks.filter(p=>
   p.hasRealtime&&p.availableCar!==null
  ).length;

  $("parkStatus").textContent=
   `附近 ${parks.length} 處停車場，`+
   `${liveCount} 處提供即時車位資訊。`;

 }catch(e){
  $("parkStatus").textContent=
   "公有停車場讀取失敗："+(e.message||e);
 }
}

async function startSearch(reuseGPS=false){
 if(running)return;
 running=true;
 stop=false;
 completed=false;
 all.clear();
 scanned=0;
 pages=0;
 parks=[];

 $("search").disabled=true;
 $("refresh").disabled=true;
 $("cancel").disabled=false;
 $("status").textContent="正在定位…";
 $("parkStatus").textContent="等待 GPS 定位…";

 try{
  if(!reuseGPS||!here){
   here=await getGPS();
  }
  if(stop)return;

  updateLocation();
  renderRoad();

  const radius=Math.min(
   Number($("radius").value),MAX_SEARCH_RADIUS
  );

  // 停車場獨立查詢，不阻塞路邊車格
  const parkPromise=loadCarparks(
   here.lat,here.lon,radius
  );

  let page=1;

  while(page&&!stop){
   const u=new URL(ROAD_API);

   for(const [k,v] of Object.entries({
    lat:here.lat,lon:here.lon,radius,page
   })){
    u.searchParams.set(k,String(v));
   }

   const controller=new AbortController();
   activeController=controller;

   const timer=setTimeout(
    ()=>controller.abort(),24000
   );

   let response;
   try{
    response=await fetch(u,{
     cache:"no-store",
     signal:controller.signal
    });
   }finally{
    clearTimeout(timer);
    activeController=null;
   }

   if(!response.ok){
    throw Error("路邊車格 API HTTP "+response.status);
   }

   const obj=await response.json();

   if(!Array.isArray(obj.data)){
    throw Error("路邊車格 API 格式不正確");
   }

   for(const r of obj.data){
    if(!r.id)continue;
    const d=Number(r.distance);
    if(Number.isFinite(d)&&d>=0&&d<=radius){
     all.set(String(r.id),r);
    }
   }

   scanned+=Number(obj.recordsScanned||0);
   pages+=Number(obj.pagesRead||0);
   completed=!!obj.complete;

   renderRoad();

   $("status").textContent=
    `已掃描 ${scanned.toLocaleString()} 筆／${pages} 頁\n`+
    `搜尋半徑 ${radius} 公尺，找到 ${all.size} 格。\n`+
    `地圖顯示最近 ${Math.min(all.size,MAX_RESULTS)} 格。`+
    (completed?"\n掃描完成。":"\n繼續搜尋…");

   page=obj.nextPage;
   if(!page)break;
  }

  if(stop){
   $("status").textContent+="\n已停止，資料可能不完整。";
  }else if(!completed){
   $("status").textContent+="\n尚未完整掃描所有資料頁。";
  }else{
   $("status").textContent+="\n實際空位以現場為準。";
  }

  await parkPromise;

 }catch(e){
  $("status").textContent=stop
   ?"已停止搜尋，資料可能不完整。"
   :"搜尋失敗："+(e.message||e);
 }finally{
  running=false;
  $("search").disabled=false;
  $("refresh").disabled=false;
  $("cancel").disabled=true;
  renderRoad();
 }
}

$("search").onclick=()=>startSearch(false);
$("refresh").onclick=()=>startSearch(true);
$("cancel").onclick=()=>{
 stop=true;
 activeController?.abort();
};
$("radius").onchange=()=>{
 if(!running)startSearch(true);
};

window.addEventListener("load",()=>{
 initMap();
 if(map)startSearch(false);
});

if("serviceWorker" in navigator&&
 location.protocol==="https:"){
 navigator.serviceWorker.register("./sw.js")
  .catch(console.warn);
}
</script>
</body>
</html>
